spring.application.name=wikinews
wikinews.index.path=index
wikinews.data.path=data/itwikinews_namespace_0_0.ndjson
wikinews.data.maxArticle=249

# Operatore tra le parole della query: true = AND (tutte obbligatorie), false = OR (ne basta una)
wikinews.search.and-operator=true

# Pesi della ricerca (vedi SearchSettings). Questi sono i valori di default:
# cambiano solo l'ordine dei risultati. Boost 0 = campo escluso dalla ricerca.
wikinews.search.name-boost=3
wikinews.search.abstract-boost=2
wikinews.search.content-boost=1
wikinews.search.categories-boost=1
# Bonus se le parole della query sono vicine (al massimo proximity-slop posizioni). 0 = disattivato.
wikinews.search.proximity-boost=2
wikinews.search.proximity-slop=3
