<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Wikinews Search</title>
    <style>
        :root { --bg:#f7f7f5; --fg:#1f2328; --muted:#6a7078; --accent:#1a5fb4; --card:#fff; --line:#e1e3e6; }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#16181b; --fg:#e6e8ea; --muted:#9aa1a9; --accent:#7ab0ff; --card:#1f2226; --line:#32363b; }
        }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
        .wrap { max-width:820px; margin:0 auto; padding:0 16px 48px; }
        header.top { padding:20px 0 8px; }
        header.top a { color:var(--fg); text-decoration:none; font-weight:700; font-size:1.25rem; }
        form.search { display:flex; flex-direction:column; gap:10px; }
        .row { display:flex; gap:8px; flex-wrap:wrap; }
        input[type=text], input[type=date], select { padding:10px 12px; border:1px solid var(--line); border-radius:8px;
            background:var(--card); color:var(--fg); font:inherit; }
        input[name=q] { flex:1; min-width:200px; }
        button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
        details { color:var(--muted); font-size:.9rem; }
        details summary { cursor:pointer; }
        .meta { color:var(--muted); font-size:.9rem; margin:16px 0 8px; }
        .error { background:#fde8e8; color:#8a1c1c; padding:10px 14px; border-radius:8px; margin-top:16px; }
        article.hit { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:10px 0; }
        article.hit h2 { margin:0 0 2px; font-size:1.1rem; }
        article.hit h2 a { color:var(--accent); text-decoration:none; }
        article.hit h2 a:hover { text-decoration:underline; }
        .snippet { margin:6px 0; }
        mark { background:#ffe9a8; color:#222; border-radius:2px; padding:0 1px; }
        .tags { display:flex; gap:6px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); }
        .tags a { color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:0 8px; text-decoration:none; }
        .tags a:hover { color:var(--accent); border-color:var(--accent); }
        nav.pager { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
        nav.pager a { color:var(--accent); }
        .hero { text-align:center; margin:12vh 0 24px; }
        .hero h1 { font-size:2rem; margin:0 0 6px; }
        .hero p { color:var(--muted); margin:0; }
        .help { color:var(--muted); font-size:.9rem; margin-top:24px; }
        .help code { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
    </style>
</head>
<body>
<form th:fragment="searchForm" class="search" action="/search" method="get" role="search">
    <div class="row">
        <input type="text" name="q" th:value="${q}" placeholder="Cerca nelle notizie di Wikinews…" aria-label="Cerca" autofocus>
        <button type="submit">Cerca</button>
    </div>
    <details th:open="${!#strings.isEmpty(category) or from != null or to != null or sort == 'date'}">
        <summary>Filtri e ordinamento</summary>
        <div class="row" style="margin-top:8px">
            <input type="text" name="category" th:value="${category}" placeholder="Categoria" aria-label="Categoria">
            <label>Dal <input type="date" name="from" th:value="${from}"></label>
            <label>al <input type="date" name="to" th:value="${to}"></label>
            <select name="sort" aria-label="Ordinamento">
                <option value="relevance" th:selected="${sort != 'date'}">Più rilevanti</option>
                <option value="date" th:selected="${sort == 'date'}">Più recenti</option>
            </select>
        </div>
    </details>
</form>
</body>
</html>
