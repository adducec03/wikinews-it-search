<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Risultati · Wikinews Search')}"></head>
<body>
<!--/*
  VARIABILI DEL MODEL (riempite da SearchController.search):
    q, category, from, to, sort   -> parametri della ricerca corrente
    response                      -> SearchResponse (totalHits, tookMs, page, totalPages, results)
    error                         -> messaggio di errore (se la ricerca fallisce)
  Ogni elemento di response.results (r) ha: url, title, date, snippet, categories.
*/-->

<header th:replace="~{fragments/header :: header}"></header>

<main class="wrap">

    <form th:replace="~{fragments/searchBar :: searchBar}"></form>

    <!-- Errore -->
    <div class="error" th:if="${error}" th:text="${error}" role="alert"></div>

    <!-- Riepilogo risultati -->
    <p class="meta" th:if="${response}">
        <span th:text="${#numbers.formatInteger(response.totalHits, 1, 'POINT')}">0</span> risultati
        (<span th:text="${response.tookMs}">0</span> ms) — pagina
        <span th:text="${response.page}">1</span> di <span th:text="${response.totalPages}">1</span>
    </p>
    <p class="meta" th:if="${response == null and error == null}">Inserisci una query per iniziare.</p>

    <section th:if="${response}">
        <p th:if="${response.results.empty}">Nessun risultato.</p>

        <!-- Un risultato -->
        <article class="hit" th:each="r : ${response.results}">
            <h2><a th:href="${r.url}" th:text="${r.title}" target="_blank" rel="noopener">Titolo</a></h2>
            <div class="meta hit-date" th:if="${r.date}"
                 th:text="${#dates.format(r.date, 'dd/MM/yyyy')}">01/01/2025</div>
            <p class="snippet" th:utext="${r.snippet}">snippet</p>

            <!-- Categorie: click = nuova ricerca con quel filtro -->
            <div class="tags">
                <a th:each="c : ${r.categories}" th:text="${c}"
                   th:href="@{/search(q=${q}, category=${c}, sort=${sort})}">categoria</a>
            </div>
        </article>

        <!-- Paginazione: mantiene q, filtri e ordinamento, cambia solo page -->
        <nav class="pager" aria-label="Paginazione" th:if="${response.totalPages > 1}">
            <a th:if="${response.page > 1}"
               th:href="@{/search(
                    q=${q},
                    category=${category},
                    from=${from},
                    to=${to},
                    sort=${sort},
                    page=${response.page - 1})}">← Precedente</a>
            <span th:unless="${response.page > 1}"></span>

            <a th:if="${response.page < response.totalPages}"
               th:href="@{/search(
                    q=${q},
                    category=${category},
                    from=${from},
                    to=${to},
                    sort=${sort},
                    page=${response.page + 1})}">Successiva →</a>
        </nav>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
